name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rivalry_test
          POSTGRES_USER: rivalry
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivalry -d rivalry_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rivalry:test-only-password@localhost:5432/rivalry_test
      TEST_DATABASE_URL: postgresql+psycopg://rivalry:test-only-password@localhost:5432/rivalry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e '.[dev]'
      - name: Lint API
        working-directory: apps/api
        run: ruff check .
      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Test API
        working-directory: apps/api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web
        working-directory: apps/web
        run: npm run lint
      - name: Test web
        working-directory: apps/web
        run: npm test
      - name: Type-check and build web
        working-directory: apps/web
        run: npm run build
