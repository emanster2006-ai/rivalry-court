# Render Blueprint: API (Docker) + web app (static). Database and sign-in live in Supabase.
# Values marked sync:false are secrets you enter in the Render dashboard; they are never stored in git.
services:
  - type: web
    name: rivalry-court-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: sh -c "alembic upgrade head && uvicorn rivalry.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_URL
        value: https://rivalry-court-web.onrender.com
      - key: AUTH_JWKS_URL
        value: https://gfgbawwuwacaduneaxaa.supabase.co/auth/v1/.well-known/jwks.json
      - key: DATABASE_URL # Supabase session-pooler string, rewritten to start with postgresql+psycopg://
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT # Render's free plan blocks 25/465/587; Brevo also listens on 2525 (verify in Brevo docs)
        value: "2525"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USER # Brevo SMTP login (ends in @smtp-brevo.com)
        sync: false
      - key: SMTP_PASSWORD # Brevo SMTP key
        sync: false
      - key: MAIL_FROM
        value: Rivalry Court <emanster2006@gmail.com>

  - type: web
    name: rivalry-court-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rivalry-court-api.onrender.com
      - key: VITE_AUTH_URL
        value: https://gfgbawwuwacaduneaxaa.supabase.co/auth/v1
      - key: VITE_AUTH_ANON_KEY # publishable key: designed to be public
        value: sb_publishable_4n9geyttC98T2zyjwnqSWA_GG0MM8s2
